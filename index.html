  <script type="module">
    let stage = 'loading Three.js modules';
    function showFailure(err, where) {
      const loading=document.getElementById('loading'), box=document.getElementById('error');
      if(loading)loading.style.display='none'; if(!box)return;
      box.style.display='flex';box.style.flexDirection='column';box.style.gap='12px';box.innerHTML='';
      const title=document.createElement('h2');title.textContent='The 3D experience could not start';title.style.cssText='margin:0;color:#ffe2b3;font:500 25px Georgia,serif';
      const intro=document.createElement('p');intro.textContent='The page could not initialise its 3D scene. Here is the specific failure:';intro.style.cssText='max-width:640px;margin:0;color:#d7d7e5';
      const details=document.createElement('pre');details.textContent='Stage: '+(where||'unknown')+'\n'+(err?.stack||err?.message||String(err));details.style.cssText='max-width:min(760px,90vw);max-height:34vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;padding:14px;background:#111426;border:1px solid #39405e;border-radius:12px;color:#ffd99e;font:12px/1.5 ui-monospace,monospace';
      const actions=document.createElement('div');actions.style.cssText='display:flex;gap:10px;flex-wrap:wrap;justify-content:center';
      const copy=document.createElement('button');copy.textContent='Copy error details';copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(details.textContent);copy.textContent='Copied';}catch(_){copy.textContent='Select error text to copy';}});
      const reload=document.createElement('button');reload.textContent='Reload page';reload.addEventListener('click',()=>location.reload());actions.append(copy,reload);box.append(title,intro,details,actions);
    }

    async function startExperience(){
      try{
        const THREE=await import('three');
        const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');
        const {EffectComposer}=await import('three/addons/postprocessing/EffectComposer.js');
        const {RenderPass}=await import('three/addons/postprocessing/RenderPass.js');
        const {ShaderPass}=await import('three/addons/postprocessing/ShaderPass.js');

        stage='preparing the experience';

        const canvas=document.getElementById('scene'),intro=document.getElementById('intro'),hud=document.getElementById('hud');
        const loading=document.getElementById('loading'),input=document.getElementById('nameInput'),toast=document.getElementById('toast');
        const cinematicOverlay=document.getElementById('cinematic-overlay'),sceneCaption=document.getElementById('sceneCaption'),finalNote=document.getElementById('finalNote');
        let displayName=(new URLSearchParams(location.search).get('name')||'').trim().slice(0,24);
        input.value=displayName;
        const initialFinalGreeting=document.getElementById('finalGreeting');if(initialFinalGreeting)initialFinalGreeting.textContent=displayName?`Happy Diwali, ${displayName}!`:'Happy Diwali!';
        let renderer,composer,lensPass,bloomPass,scene,camera,controls;
        let blackHoleGroup,wormholeGroup,interiorGroup,singularityGroup,arrivalGroup,starField,wormholeMaterial,wormholeStreaks,blackHoleDiskMaterial;
        let interiorRings=[],singularityParticles;
        let travelStars,travelStreaks,travelStarSpeeds,travelStarRand,greetingMesh,travelField;
        let omMesh,omAura,omRings=[],omParticles,omSymbolGroup;
        let fireworksGroup,fireworksPoints,fireworkPositions,fireworkColors,fireworkBaseColors,fireworkMeta=[],fireworkRand;
        let sparklePoints,sparkleBaseColors,sparklePhases=[],sparkleClock=0,nebulaClouds=[],shootingStarsGroup,shootingStars=[];
        let starDotTexture,warpStreaks,warpStreakGeometry,warpStreakBase=[],journeyWarpIntensity=0;
        const sessionSeed=(Math.random()*0x100000000)>>>0;
        const countdownEl=document.getElementById('countdown'),countdownLabel=document.getElementById('countdownLabel'),countdownValue=document.getElementById('countdownValue');
        let lastCountdownSecond=-1;
        let phase='idle',journeyStart=0,celebrationStart=0,celebrationCameraFrom=null,celebrationTargetFrom=null,journeySpeed=0;
        let controlsEnabled=false;
        const clock=new THREE.Clock();
        const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const journeyDuration=reducedMotion?9000:32000;
        const celebrationDuration=reducedMotion?9000:20500;
        const totalDuration=journeyDuration+celebrationDuration;
        function updateCountdown(now){
          if(phase==='idle')return;
          let elapsed=0;
          if(phase==='journey')elapsed=now-journeyStart;
          else if(phase==='celebration')elapsed=journeyDuration+(now-celebrationStart);
          else elapsed=totalDuration;
          const remaining=Math.max(0,totalDuration-elapsed),seconds=Math.ceil(remaining/1000);
          if(seconds!==lastCountdownSecond||phase==='done'){
            lastCountdownSecond=seconds;
            countdownValue.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
            if(phase==='done'){countdownLabel.textContent='COMPLETE';countdownEl.classList.add('complete');}
            else{countdownLabel.textContent='TIME LEFT';countdownEl.classList.remove('complete');}
          }
        }

        function seeded(seed){let x=seed>>>0;return()=>{x=(1664525*x+1013904223)>>>0;return x/4294967296;};}
        function smooth(t){t=THREE.MathUtils.clamp(t,0,1);return t*t*(3-2*t);}
        function setGroupOpacity(group,amount){
          if(!group)return;amount=THREE.MathUtils.clamp(amount,0,1);group.visible=amount>.002;
          group.traverse(obj=>{
            if(obj.isPointLight){if(obj.userData.__fadeBaseIntensity===undefined)obj.userData.__fadeBaseIntensity=obj.intensity;obj.intensity=obj.userData.__fadeBaseIntensity*amount;}
            if(!obj.material)return;
            const materials=Array.isArray(obj.material)?obj.material:[obj.material];
            for(const mat of materials){
              if(mat.userData.__fadeBaseOpacity===undefined){mat.userData.__fadeBaseOpacity=mat.opacity??1;mat.userData.__fadeBaseTransparent=mat.transparent;mat.userData.__fadeBaseDepthWrite=mat.depthWrite;}
              const nextTransparent=mat.userData.__fadeBaseTransparent||amount<.999;
              if(mat.transparent!==nextTransparent){mat.transparent=nextTransparent;mat.needsUpdate=true;}
              mat.opacity=mat.userData.__fadeBaseOpacity*amount;
              mat.depthWrite=amount<.999?false:mat.userData.__fadeBaseDepthWrite;
            }
          });
        }
        function easeIn(t){t=THREE.MathUtils.clamp(t,0,1);return t*t*t;}
        function setCaption(text,visible=true){if(sceneCaption.textContent!==text)sceneCaption.textContent=text;sceneCaption.classList.toggle('show',visible);}
        function makeCanvasTexture(draw,w=1024,h=512){const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');draw(ctx,w,h);const tx=new THREE.CanvasTexture(c);tx.colorSpace=THREE.SRGBColorSpace;tx.anisotropy=Math.min(8,renderer?.capabilities?.getMaxAnisotropy?.()||4);return tx;}
        function createStarDotTexture(){
          // A radial-alpha sprite keeps point stars circular instead of square pixels.
          return makeCanvasTexture((ctx,w,h)=>{
            const g=ctx.createRadialGradient(w*.5,h*.5,0,w*.5,h*.5,w*.49);
            g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.18,'rgba(255,255,255,.96)');
            g.addColorStop(.48,'rgba(255,255,255,.42)');g.addColorStop(.82,'rgba(255,255,255,.08)');g.addColorStop(1,'rgba(255,255,255,0)');
            ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
          },64,64);
        }

        function addStarLayer(parent,count,minR,maxR,size,opacity,seed){
          const rand=seeded(seed),positions=new Float32Array(count*3),colors=new Float32Array(count*3);
          const palette=[new THREE.Color(0xc8d9ff),new THREE.Color(0xffffff),new THREE.Color(0xffe0ba),new THREE.Color(0x9db9ff),new THREE.Color(0xd5b9ff)];
          for(let i=0;i<count;i++){const z=rand()*2-1,a=rand()*Math.PI*2,r=minR+Math.pow(rand(),.7)*(maxR-minR),q=Math.sqrt(1-z*z);positions[i*3]=r*q*Math.cos(a);positions[i*3+1]=r*q*Math.sin(a);positions[i*3+2]=r*z;const c=palette[Math.floor(rand()*palette.length)].clone().multiplyScalar(.65+rand()*.7);colors[i*3]=c.r;colors[i*3+1]=c.g;colors[i*3+2]=c.b;}
          const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(positions,3));geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
          const mat=new THREE.PointsMaterial({map:starDotTexture,size,vertexColors:true,transparent:true,alphaTest:.015,opacity,sizeAttenuation:true,depthWrite:false,blending:THREE.AdditiveBlending});const p=new THREE.Points(geo,mat);parent.add(p);return p;
        }
        function addNebula(parent,center,spread,color,count,seed){
          // Each cloud gets its own random-but-repeatable-this-run particle shape and a
          // gentle drift, rather than all nebula points moving as one flat backdrop.
          const rand=seeded(seed),positions=new Float32Array(count*3),colors=new Float32Array(count*3),base=new THREE.Color(color);
          const gaussian=()=>{let u=0,v=0;while(u===0)u=rand();while(v===0)v=rand();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
          for(let i=0;i<count;i++){positions[i*3]=gaussian()*spread[0];positions[i*3+1]=gaussian()*spread[1];positions[i*3+2]=gaussian()*spread[2];const c=base.clone().multiplyScalar(.25+rand()*.9);colors[i*3]=c.r;colors[i*3+1]=c.g;colors[i*3+2]=c.b;}
          const cloud=new THREE.Group();cloud.position.set(center[0],center[1],center[2]);
          const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(positions,3));geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
          cloud.add(new THREE.Points(geo,new THREE.PointsMaterial({map:starDotTexture,size:1.05,vertexColors:true,transparent:true,alphaTest:.015,opacity:.12,sizeAttenuation:true,depthWrite:false,blending:THREE.AdditiveBlending})));
          cloud.userData.basePosition=new THREE.Vector3(...center);cloud.userData.drift=rand()*Math.PI*2;parent.add(cloud);nebulaClouds.push(cloud);return cloud;
        }
        function createBackgroundSparkles(parent){
          // Tiny stars twinkle independently; their starting positions vary each visit.
          const count=520,positions=new Float32Array(count*3),colors=new Float32Array(count*3),rand=seeded(sessionSeed^0x51a7c3);
          sparkleBaseColors=new Float32Array(count*3);sparklePhases=new Float32Array(count);
          const palette=[0xffffff,0xc9e0ff,0xffe5c7,0x9fc8ff].map(v=>new THREE.Color(v));
          for(let i=0;i<count;i++){
            const z=-250-rand()*520,a=rand()*Math.PI*2,r=90+rand()*380;
            positions[i*3]=Math.cos(a)*r;positions[i*3+1]=Math.sin(a)*r*.62;positions[i*3+2]=z;
            const c=palette[Math.floor(rand()*palette.length)].clone().multiplyScalar(.45+rand()*.5);
            sparkleBaseColors[i*3]=colors[i*3]=c.r;sparkleBaseColors[i*3+1]=colors[i*3+1]=c.g;sparkleBaseColors[i*3+2]=colors[i*3+2]=c.b;
            sparklePhases[i]=rand()*Math.PI*2;
          }
          const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(positions,3));geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
          sparklePoints=new THREE.Points(geo,new THREE.PointsMaterial({map:starDotTexture,size:.38,vertexColors:true,transparent:true,alphaTest:.015,opacity:.78,sizeAttenuation:true,depthWrite:false,blending:THREE.AdditiveBlending}));parent.add(sparklePoints);
        }
        function updateBackgroundSparkles(dt,elapsed){
          if(!sparklePoints)return;sparkleClock+=dt;if(sparkleClock<.075)return;sparkleClock=0;
          const colors=sparklePoints.geometry.attributes.color.array;
          for(let i=0;i<sparklePhases.length;i++){
            const k=i*3,twinkle=.35+.65*(.5+.5*Math.sin(elapsed*(1.1+(i%7)*.23)+sparklePhases[i]));
            colors[k]=sparkleBaseColors[k]*twinkle;colors[k+1]=sparkleBaseColors[k+1]*twinkle;colors[k+2]=sparkleBaseColors[k+2]*twinkle;
          }
          sparklePoints.geometry.attributes.color.needsUpdate=true;
        }
        function updateNebulaClouds(elapsed){
          for(let i=0;i<nebulaClouds.length;i++){
            const c=nebulaClouds[i],base=c.userData.basePosition,phase=c.userData.drift;
            c.position.x=base.x+Math.sin(elapsed*.035+phase)*.48;
            c.position.y=base.y+Math.cos(elapsed*.027+phase)*.32;
            c.rotation.z=Math.sin(elapsed*.018+phase)*.025;
          }
        }
        function createStarField(){
          starField=new THREE.Group();scene.add(starField);
          // The large-scale star layout remains composed and recognisable.
          addStarLayer(starField,19000,150,780,.24,.82,11);
          addStarLayer(starField,5200,65,360,.36,.58,22);

        function launch(){
          if(phase!=='idle')return;displayName=(input.value||'Friend').trim().slice(0,24)||'Friend';
          const url=new URL(location.href);url.searchParams.set('name',displayName);history.replaceState({},'',url);buildGreetingLetters();
          const finalGreeting=document.getElementById('finalGreeting');if(finalGreeting)finalGreeting.textContent=`Happy Diwali, ${displayName}!`;
          reseedDiwaliFireworks();
          phase='journey';journeyStart=performance.now();lastCountdownSecond=-1;journeyWarpIntensity=0;countdownLabel.textContent='TIME LEFT';countdownEl.classList.remove('complete');countdownValue.textContent=`${String(Math.floor(Math.ceil(totalDuration/1000)/60)).padStart(2,'0')}:${String(Math.ceil(totalDuration/1000)%60).padStart(2,'0')}`;travelField.reset();travelField.show();starField.position.set(camera.position.x*.12,camera.position.y*.12,camera.position.z*.12);intro.classList.add('hidden');hud.classList.add('visible');finalNote.classList.remove('show');cinematicOverlay.style.opacity='0';setCaption('',false);
        }
        function beginCelebration(){
          phase='celebration';celebrationStart=performance.now();
          setGroupOpacity(blackHoleGroup,0);blackHoleDiskMaterial.uniforms.uOpacity.value=0;
          setGroupOpacity(wormholeGroup,0);wormholeMaterial.uniforms.uOpacity.value=0;
          setGroupOpacity(interiorGroup,0);setGroupOpacity(singularityGroup,0);travelField.hide();arrivalGroup.visible=true;
          camera.position.set(0,0,-270);camera.lookAt(0,0,-340);celebrationCameraFrom=camera.position.clone();celebrationTargetFrom=new THREE.Vector3(0,0,-340);controls.target.copy(celebrationTargetFrom);controls.enabled=false;
          omMesh.material.opacity=0;omMesh.scale.setScalar(.82);omAura.material.opacity=0;omRings.forEach(r=>r.material.opacity=0);omParticles.material.opacity=0;
          greetingMesh.material.opacity=0;greetingMesh.position.set(0,0,16);greetingMesh.scale.setScalar(1);
          cinematicOverlay.style.opacity='.16';setCaption('',false);
        }
        function updateJourney(now,dt){
          const previousPosition=camera.position.clone();
          const raw=Math.min(1,(now-journeyStart)/journeyDuration);
          // One continuous exponential flight curve: it never eases to a stop at
          // stage boundaries. The observer accelerates smoothly from deep space,
          // through the horizon, into the interior, and onward through the wormhole.
          const k=3.05,progress=(Math.exp(k*raw)-1)/(Math.exp(k)-1);
          const z=68-338*progress;
          const near=smooth((progress-.025)/.60);
          const lateral=Math.sin(raw*10.8)*(.025+.38*near)+Math.sin(raw*24)*.08*near;
          const vertical=Math.cos(raw*9.4)*(.02+.26*near)+Math.sin(raw*19.5)*.045*near;
          camera.position.set(lateral,vertical,z);
          camera.lookAt(lateral*.10+Math.sin(raw*8)*.10*near,vertical*.10+Math.cos(raw*7)*.07*near,z-38);
          camera.rotateZ(Math.sin(raw*13.2)*.012*near);
          camera.rotateX(Math.sin(raw*8.5)*.006*near);
          journeySpeed=previousPosition.distanceTo(camera.position)/Math.max(dt,.001);

          // A high-speed phase builds only after the horizon approach, then softens
          // as the wormhole fills the view so the tunnel itself remains readable.
          const speedFactor=smooth((journeySpeed-3.5)/25);
          const flightWindow=smooth((raw-.36)/.16)*(1-smooth((raw-.91)/.075));
          journeyWarpIntensity=THREE.MathUtils.clamp(speedFactor*flightWindow,0,1);
          const blackHoleOpacity=1-smooth((raw-.43)/.27);
          const interiorOpacity=smooth((raw-.515)/.17)*(1-smooth((raw-.855)/.13));
          const singularityOpacity=smooth((raw-.675)/.09)*(1-smooth((raw-.805)/.095));
          const wormholeOpacity=smooth((raw-.665)/.19)*(1-smooth((raw-.974)/.026));

          // Each environment overlaps its neighbour. No group is switched on at a
          // single frame: light, geometry and particles dissolve into the next world.
          setGroupOpacity(blackHoleGroup,blackHoleOpacity);
          blackHoleDiskMaterial.uniforms.uOpacity.value=blackHoleOpacity;
          blackHoleGroup.userData.streakMat.opacity=.025+journeyWarpIntensity*.19;
          setGroupOpacity(interiorGroup,interiorOpacity);
          setGroupOpacity(singularityGroup,singularityOpacity);
          setGroupOpacity(wormholeGroup,wormholeOpacity);
          wormholeMaterial.uniforms.uOpacity.value=wormholeOpacity;
          wormholeGroup.rotation.z+=dt*(.012+journeyWarpIntensity*.055);

          // Let the distant universe drift relative to the moving observer. Near-field
          // particles and radial warp streaks provide the stronger light-speed cue.
          starField.position.set(camera.position.x*.12,camera.position.y*.12,camera.position.z*.12);
          starField.rotation.y+=dt*(.0007+journeyWarpIntensity*.010);
          starField.rotation.x+=dt*(.00012+journeyWarpIntensity*.002);

          // Warm lensing around the black hole gradually cools into blue-violet
          // distortion centred on the singularity and then the wormhole throat.
          const bhScreen=blackHoleGroup.position.clone().project(camera);
          const lensCenter=new THREE.Vector2(
            THREE.MathUtils.clamp((bhScreen.x+1)*.5,.04,.96),
            THREE.MathUtils.clamp((bhScreen.y+1)*.5,.04,.96)
          );
          const centerBlend=smooth((raw-.54)/.25);
          lensCenter.lerp(new THREE.Vector2(.5,.5),centerBlend);
          if(lensPass){
            lensPass.uniforms.uCenter.value.copy(lensCenter);
            lensPass.uniforms.uRadius.value=THREE.MathUtils.lerp(.11,.42,smooth((raw-.42)/.42));
            const lensIn=smooth((raw-.24)/.28),lensPeak=smooth((raw-.56)/.18),lensOut=1-smooth((raw-.87)/.10);
            lensPass.uniforms.uStrength.value=lensIn*(.11+.17*lensPeak)*lensOut;
            lensPass.uniforms.uChromatic.value=(.001+.003*lensPeak)*lensIn*lensOut;
          }

          // A gentle colour wash, rather than a black screen, makes the surrounding
          // universe visibly transform from warm accretion light to a cool wormhole.
          const deepShift=smooth((raw-.53)/.33);
          cinematicOverlay.style.background=`radial-gradient(ellipse at 50% 48%, rgba(${Math.round(26-13*deepShift)},${Math.round(24+9*deepShift)},${Math.round(62+48*deepShift)},.08), rgba(4,${Math.round(7+7*deepShift)},${Math.round(23+22*deepShift)},.32) 78%, rgba(1,2,12,.46))`;
          cinematicOverlay.style.opacity=String(.10+.10*smooth((raw-.56)/.22));
          if(raw>=1)beginCelebration();
        }

        function updateCelebration(now,dt){
          const t=Math.min(1,(now-celebrationStart)/celebrationDuration);
          // Settle the viewer after the wormhole exit; keep the greeting ahead of Om in depth.
          const cameraT=smooth(Math.min(1,t/.16));camera.position.lerpVectors(celebrationCameraFrom,new THREE.Vector3(0,0,-286),cameraT);camera.lookAt(0,0,-340);

          // First: the complete two-line greeting appears and remains readable on its own.
          const greetingIn=smooth((t-.18)/.16);
          const travel=smooth((t-.50)/.34);
          greetingMesh.position.set(0,0,16-18*travel);
          greetingMesh.scale.setScalar(1-.92*travel);
          greetingMesh.material.opacity=greetingIn*(1-smooth((t-.78)/.09));

          // Only after the greeting is visible does Om emerge behind it. As the words
          // travel forward they shrink into the symbol and the symbol brightens.
          const omIn=smooth((t-.59)/.25);
          const mergeGlow=smooth((t-.78)/.12);
          if(bloomPass)bloomPass.strength=THREE.MathUtils.lerp(window.innerWidth<700?.26:.42,window.innerWidth<700?.34:.54,mergeGlow);
          omMesh.material.opacity=omIn*.94;omAura.material.opacity=omIn*(.38+.10*mergeGlow);
          omRings.forEach((r,i)=>r.material.opacity=omIn*(i===1?.28:.34));
          omParticles.material.opacity=omIn*.42;

          cinematicOverlay.style.opacity=String(.16*(1-smooth(t/.24)));
          starField.position.z=THREE.MathUtils.lerp(starField.position.z,0,dt*.5);
          // Let the visual greeting speak for itself; no additional poetic captions.
          setCaption('',false);

          arrivalGroup.rotation.z=Math.sin((now-celebrationStart)*.00012)*.012;
          const pulse=1+.018*Math.sin((now-celebrationStart)*.0024);
          omMesh.scale.setScalar(THREE.MathUtils.lerp(.82,1,omIn)*pulse);
          omAura.scale.setScalar(pulse*(1+mergeGlow*.10));
          omRings.forEach((r,i)=>{r.rotation.z+=(i%2?-.0012:.0015);r.scale.setScalar(1+.012*Math.sin((now-celebrationStart)*.0018+i));});
          omParticles.rotation.z+=.0015+mergeGlow*.002;
          updateDiwaliFireworks(dt,t,true);
          updateShootingStars(dt);
          updateBackgroundSparkles(dt,clock.elapsedTime);
          updateNebulaClouds(clock.elapsedTime);
          starField.rotation.y+=.000025;
          if(t>=.88)finalNote.classList.add('show');
          if(t>=1){phase='done';fireworksGroup.visible=false;controls.enabled=true;setCaption('',false);updateCountdown(now);}
        }
        function animate(now){
          const dt=Math.min(clock.getDelta(),.05),elapsed=clock.elapsedTime;
          if(blackHoleGroup?.visible){blackHoleGroup.userData.diskGroup.rotation.z+=dt*(phase==='journey'?.18:.08);blackHoleGroup.userData.hot.rotation.z+=dt*.05;blackHoleGroup.userData.outer.rotation.z-=dt*.025;blackHoleGroup.userData.photon.rotation.z+=dt*.018;blackHoleDiskMaterial.uniforms.uTime.value=elapsed;}
          if(wormholeGroup?.visible){wormholeMaterial.uniforms.uTime.value=elapsed;wormholeGroup.rotation.z+=dt*.018;if(wormholeStreaks){const arr=wormholeStreaks.geometry.attributes.position.array;for(let i=0;i<arr.length;i+=3){arr[i+2]+=dt*(phase==='journey'?58:18);if(arr[i+2]>135)arr[i+2]=-135;}wormholeStreaks.geometry.attributes.position.needsUpdate=true;}}
          if(interiorGroup?.visible){interiorGroup.rotation.z+=dt*.014;interiorRings.forEach((r,i)=>{r.rotation.z+=(i%2?-.012:.009);r.rotation.x+=dt*.003;});if(singularityParticles)singularityParticles.rotation.z-=dt*.22;if(singularityGroup?.visible)singularityGroup.rotation.z+=dt*.12;}
          if(starField&&phase!=='journey'){starField.rotation.y+=dt*.00016;starField.rotation.x+=dt*.00004;}
          if(phase==='journey'){updateJourney(now||performance.now(),dt);travelField.update(dt,journeySpeed,journeyWarpIntensity);}
          else if(phase==='celebration')updateCelebration(now||performance.now(),dt);
          else if(phase==='done'){arrivalGroup.rotation.z=Math.sin(elapsed*.13)*.012;omParticles.rotation.z+=dt*.0012;omRings.forEach((r,i)=>r.rotation.z+=(i%2?-.001:.001));updateShootingStars(dt);updateBackgroundSparkles(dt,elapsed);updateNebulaClouds(elapsed);}
          updateCountdown(now||performance.now());
          if(controls?.enabled)controls.update();if(composer&&scene&&camera)composer.render();else if(renderer&&scene&&camera)renderer.render(scene,camera);
        }
        function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2600);}
        function share(){const url=new URL(location.href);url.searchParams.set('name',displayName||'Friend');if(!/^https?:$/.test(url.protocol)){showToast('Publish this page online first, then share its HTTPS link.');return;}const msg=`Happy Diwali, ${displayName||'Friend'}! ✨ ${url.toString()}`;window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank','noopener,noreferrer');}
        function restart(){phase='idle';lastCountdownSecond=-1;countdownEl.classList.remove('complete');countdownLabel.textContent='TIME LEFT';countdownValue.textContent='00:53';controls.enabled=false;travelField.hide();setGroupOpacity(blackHoleGroup,1);blackHoleGroup.scale.setScalar(1);blackHoleDiskMaterial.uniforms.uOpacity.value=1;setGroupOpacity(wormholeGroup,0);wormholeMaterial.uniforms.uOpacity.value=0;setGroupOpacity(interiorGroup,0);setGroupOpacity(singularityGroup,0);starField.position.set(0,0,0);journeyWarpIntensity=0;fireworksGroup.visible=false;arrivalGroup.visible=false;arrivalGroup.position.set(0,0,-340);cinematicOverlay.style.opacity='0';finalNote.classList.remove('show');hud.classList.remove('visible');intro.classList.remove('hidden');setCaption('',false);camera.position.set(0,0,68);camera.lookAt(0,0,0);controls.target.set(0,0,-340);blackHoleDiskMaterial.uniforms.uOpacity.value=1;blackHoleDiskMaterial.uniforms.uTime.value=0;omMesh.material.opacity=0;omMesh.scale.setScalar(.82);omAura.material.opacity=0;omRings.forEach(r=>r.material.opacity=0);omParticles.material.opacity=0;greetingMesh.material.opacity=0;greetingMesh.position.set(0,0,16);greetingMesh.scale.setScalar(1);}

        document.getElementById('launch').addEventListener('click',launch);input.addEventListener('keydown',e=>{if(e.key==='Enter')launch();});document.getElementById('shareBtn').addEventListener('click',share);document.getElementById('restartBtn').addEventListener('click',restart);
        init();
      }catch(err){console.error('Diwali experience startup failed at '+stage,err);showFailure(err,stage);}
    }
    startExperience();
  </script>
</body>
</html>
